name: Build Samar AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Wrapper, Keystore & Config
        run: |
          # 1. Generate standard Gradle wrapper
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          
          # 2. Create debug keystore in root
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 3. Create dummy environment file
          echo "GEMINI_API_KEY=AIzaSy_demo_key" > .env
          
          # 4. Create mock google-services.json
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "samar-ai",
              "storage_bucket": "samar-ai.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcde12345",
                  "android_client_info": {
                    "package_name": "com.aistudio.samar.ai"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKey" }],
                "services": {
                  "analytics_service": { "status": 1 }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamarAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
