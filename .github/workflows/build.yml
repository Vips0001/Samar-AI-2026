name: Build Samar AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Config & Keystore
        run: |
          # 1. Create debug keystore
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 2. Setup SDK path for Gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 3. Setup Secrets & Env
          echo "GEMINI_API_KEY=AIzaSy_demo_key" > .env
          echo "DEFAULT_MODEL_NAME=gemini-2.5-flash" >> .env
          
          # 4. Create mock google-services.json
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "samar-ai-app",
              "storage_bucket": "samar-ai-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.samar.ai"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKey" }],
                "services": { "analytics_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            -x test \
            -x lint \
            -x verifyRoborazziDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dksp.use.ksp2=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamarAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
