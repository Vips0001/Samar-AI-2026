name: Build Samar AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android Build Files
        run: |
          # 1. Create debug keystore
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 2. Setup secrets & environment files with your API key
          API_KEY="${{ secrets.GEMINI_API_KEY || 'AIzaSyYourRealKeyHere' }}"
          echo "GEMINI_API_KEY=$API_KEY" > .env
          echo "DEFAULT_MODEL_NAME=gemini-2.5-flash" >> .env
          cp .env app/.env 2>/dev/null || true
          
          touch secrets.properties
          echo "GEMINI_API_KEY=$API_KEY" >> secrets.properties
          
          # 3. Create mock google-services.json
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "samar-ai-app",
              "storage_bucket": "samar-ai-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef12345",
                  "android_client_info": {
                    "package_name": "com.aistudio.samar.ai"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKey123" }],
                "services": {
                  "analytics_service": { "status": 1 }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true" \
            -Dsecrets.ignoreList="[]"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamarAI-APK
          path: app/build/outputs/apk/debug/*.apk
